<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Read Aloud</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Read Aloud</h1>
      <span id="status" class="status" role="status" aria-live="polite">Ready</span>
    </header>

    <section class="player" aria-label="Playback">
      <div class="transport">
        <button id="prev" class="round" title="Previous sentence (←)" aria-label="Previous sentence" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h2v14H5zM19 5v14L8 12z" /></svg>
        </button>
        <button id="toggle" class="round primary" title="Read (Space)" aria-label="Read">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
        </button>
        <button id="next" class="round" title="Next sentence (→)" aria-label="Next sentence" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5h2v14h-2zM5 5v14l11-7z" /></svg>
        </button>
        <button id="stop" class="round" title="Stop (Esc)" aria-label="Stop" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" /></svg>
        </button>
      </div>
      <div class="progress" aria-hidden="true"><div id="progress"></div></div>
    </section>

    <section class="text">
      <textarea
        id="input"
        aria-label="Text to read"
        placeholder="Copy a chat reply with its copy button, then paste it here (⌘V). Reading starts on paste."
        spellcheck="false"
      ></textarea>
      <div id="reader" class="reader" hidden></div>
      <div class="row">
        <button id="edit" class="link" hidden>Edit text</button>
        <button id="clear" class="link">Clear</button>
      </div>
    </section>

    <details class="card settings" id="settings">
      <summary>
        <span>Voice and speed</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
      </summary>
      <div class="settings-body">
        <label class="field">
          <span class="field-head">Voice</span>
          <span class="select">
            <select id="voice"><option>Loading voices…</option></select>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
          </span>
        </label>

        <div class="field">
          <div class="field-head"><label for="rate">Speed</label><output id="rate-out" for="rate"></output></div>
          <input id="rate" type="range" min="-50" max="100" step="5" />
          <div id="presets" class="chips" role="group" aria-label="Speed presets"></div>
        </div>
        <div class="field">
          <div class="field-head"><label for="pitch">Pitch</label><output id="pitch-out" for="pitch"></output></div>
          <input id="pitch" type="range" min="-50" max="50" step="5" />
        </div>
        <div class="field">
          <div class="field-head"><label for="volume">Volume</label><output id="volume-out" for="volume"></output></div>
          <input id="volume" type="range" min="-50" max="50" step="5" />
        </div>

        <div class="toggles">
          <label class="toggle"><span>Start reading on paste</span><input id="autoRead" type="checkbox" role="switch" /></label>
          <label class="toggle"><span>Highlight each word</span><input id="wordHighlight" type="checkbox" role="switch" /></label>
          <label class="toggle"><span>Skip Markdown and code blocks</span><input id="stripMarkdown" type="checkbox" role="switch" /></label>
        </div>

        <button id="reset" class="link reset">Reset to defaults</button>
      </div>
    </details>

    <footer>
      <span>Click a sentence to read from there</span>
      <span><kbd>Space</kbd> play/pause</span>
      <span><kbd>←</kbd> <kbd>→</kbd> sentence</span>
      <span><kbd>Esc</kbd> stop</span>
    </footer>

    <script type="module" src="panel.ts"></script>
  </body>
</html>
